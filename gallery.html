<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>图片画廊 · 图提取 ImageGrab</title>
    <link rel="stylesheet" href="gallery.css" />
  </head>
  <body>
    <!-- 顶部栏：品牌 + 当前页面信息 + 下载操作 -->
    <header class="topbar">
      <div class="topbar__brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path
              fill="currentColor"
              d="M12 3a1 1 0 0 1 1 1v9.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.42l2.3 2.3V4a1 1 0 0 1 1-1Z"
            />
            <path
              fill="currentColor"
              d="M4 16a1 1 0 0 1 1 1v2h14v-2a1 1 0 1 1 2 0v2.5A1.5 1.5 0 0 1 19.5 21h-15A1.5 1.5 0 0 1 3 19.5V17a1 1 0 0 1 1-1Z"
            />
          </svg>
        </span>
        <div class="topbar__titles">
          <h1>图片画廊</h1>
          <p id="page-meta" class="topbar__meta">正在读取…</p>
        </div>
      </div>

      <div class="topbar__actions">
        <button type="button" id="btn-select-all" class="btn btn--ghost">全选</button>
        <button type="button" id="btn-invert" class="btn btn--ghost">反选</button>
        <span id="selected-count" class="pill">已选 0 张</span>
        <button type="button" id="btn-download" class="btn btn--primary">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 3a1 1 0 0 1 1 1v9.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.42l2.3 2.3V4a1 1 0 0 1 1-1Z"
            />
            <path
              fill="currentColor"
              d="M4 16a1 1 0 0 1 1 1v2h14v-2a1 1 0 1 1 2 0v2.5A1.5 1.5 0 0 1 19.5 21h-15A1.5 1.5 0 0 1 3 19.5V17a1 1 0 0 1 1-1Z"
            />
          </svg>
          下载选中
        </button>
      </div>
    </header>

    <!-- 下载进度条 -->
    <div id="progress-wrap" class="progress-wrap" hidden>
      <div class="progress-wrap__bar"><span id="progress-bar"></span></div>
      <p id="progress-text" class="progress-wrap__text">准备下载…</p>
    </div>

    <!-- 演示模式提示 -->
    <div id="demo-banner" class="demo-banner" hidden>
      <strong>演示模式</strong>
      <span>当前页面未在扩展环境中运行，展示的是示例商品图；点「下载选中」会直接保存本地示例图片。</span>
    </div>

    <main class="content">
      <div id="empty-state" class="empty" hidden>
        <h2>还没有提取结果</h2>
        <p>打开淘宝 / 天猫 / 京东 / 拼多多商家版的商品详情页，点击右下角「获取图片」按钮即可。</p>
      </div>

      <section id="grid" class="grid" aria-label="图片列表"></section>
    </main>

    <footer class="footer">
      <span>图提取 ImageGrab · 批量提取商品图并统一转为 PNG</span>
      <span id="footer-tip">支持淘宝、天猫、京东、拼多多商家版</span>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="gallery.js"></script>
  </body>
</html>
